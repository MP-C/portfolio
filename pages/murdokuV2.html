<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arquivo Murdoku — 80 Casos</title>
<style>
:root{--g:#c9a24b;--r:#a3202a;--p:#17120f;--t:#e8dcc3}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1d1511,#090706 70%);color:var(--t);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #3a2d1a;background:#0a0807}
h1{margin:0;font:700 20px/1 "Courier New",monospace;letter-spacing:.25em;color:var(--g);text-shadow:0 0 12px #c9a24b55;animation:fl 6s infinite}
@keyframes fl{0%,92%,100%{opacity:1}94%{opacity:.4}96%{opacity:1}98%{opacity:.5}}
button,input{font:inherit}
.b{background:#1f1813;color:var(--t);border:1px solid #5a4b2b;padding:7px 12px;cursor:pointer;border-radius:3px}
.b:hover{border-color:var(--g);color:var(--g)}
.b.on{background:var(--g);color:#120d08}
nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#cn{font-family:"Courier New",monospace;color:var(--g);min-width:70px;text-align:center}
main{display:flex;flex-wrap:wrap;gap:20px;padding:20px;max-width:1180px;margin:auto}
.L{flex:0 1 560px}.Rr{flex:1 1 340px;min-width:300px}
.card{background:var(--p);border:1px solid #3a2d1a;padding:14px;border-radius:4px;margin-bottom:14px}
h2{margin:0 0 8px;font:600 12px "Courier New",monospace;letter-spacing:.2em;color:var(--g);text-transform:uppercase}
h3{margin:0 0 4px;font-size:20px}
.bd{display:grid;grid-template-columns:22px repeat(6,var(--cs));--cs:clamp(46px,11.5vw,70px);width:max-content;max-width:100%;margin:8px 0}
.l{color:#8a7a55;font:11px monospace;display:flex;align-items:center;justify-content:center;height:var(--cs);font-style:normal}
.l.h{height:20px}
.c{width:var(--cs);height:var(--cs);position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:calc(var(--cs)*.45);user-select:none}
.c:hover{filter:brightness(1.35)}
.rl{position:absolute;top:1px;left:3px;font:8px/1 sans-serif;color:#d9c48aaa;pointer-events:none;max-width:92%}
.wn{position:absolute;right:1px;bottom:0;font-size:9px;opacity:.85}
.sn{font:700 calc(var(--cs)*.19)/1.1 sans-serif;color:#fff;background:#7a1c24;padding:2px 4px;border-radius:2px}
.vc{color:#ff4a4a;filter:drop-shadow(0 0 6px #f00)}
.bad{outline:2px solid #ff3b3b;outline-offset:-4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
ul,ol{margin:0;padding-left:20px;line-height:1.5}
li{margin-bottom:3px}
#an{background:#0d0a08;color:var(--t);border:1px solid #5a4b2b;padding:8px;width:60%;border-radius:3px}
#msg{color:#e3736e;min-height:18px;font-size:14px;margin-top:6px}
.ok{color:#7fc47f}.no{color:#e3736e}
#md,#ixm{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#md.s,#ixm.s{display:flex}
#md>div,#ixm>div{max-width:540px;width:100%;background:#120d0a;border:2px solid var(--g);padding:26px;text-align:center;box-shadow:0 0 40px #c9a24b33}
#tx{white-space:pre-wrap;font:16px/1.6 "Courier New",monospace;min-height:130px;text-align:left}
.ix{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:12px 0}
.ix .b{padding:6px 0;font-size:13px}
.ix .g{border-color:#4f9a4f;color:#7fc47f}.ix .x{border-color:#a3202a}
small{color:#8a7a55}
</style>
</head>
<body>
<header>
  <h1>ARQUIVO MURDOKU</h1>
  <nav>
    <button class="b" id="pv">◀</button><span id="cn"></span><button class="b" id="nx">▶</button>
    <button class="b" id="ixb">Índice</button><button class="b" id="sd">🔊 Som</button>
  </nav>
</header>
<main>
  <section class="L">
    <div class="card">
      <h2>Dossiê</h2><h3 id="tt"></h3><p id="st"></p>
      <div class="tools" id="pal"></div>
      <div class="tools"><button class="b" data-m="p">Colocar</button><button class="b" data-m="x">✕ Anotar</button><button class="b" data-m="e">Apagar</button><button class="b" id="clr">Limpar grelha</button></div>
      <div class="bd" id="bd"></div>
      <small>Um suspeito por linha e por coluna. O culpado estava sozinho com a vítima (💀) na mesma divisão. Os móveis bloqueiam casas.</small>
    </div>
  </section>
  <section class="Rr">
    <div class="card"><h2>Pistas</h2><ol id="cl"></ol></div>
    <div class="card"><h2>Acusação</h2>
      <form id="ac" autocomplete="off"><input id="an" list="dl" placeholder="Nome do assassino"><datalist id="dl"></datalist> <button class="b">Acusar</button></form>
      <div id="msg"></div></div>
    <div class="card"><h2>O meu registo</h2><ul id="hs"></ul></div>
    <div class="card"><h2>Lógica e solução</h2><div id="sv"></div></div>
  </section>
</main>
<div id="md"><div><div id="tx"></div><p><button class="b" id="mc">Fechar</button> <button class="b" id="mn" style="display:none">Próximo caso ▶</button></p></div></div>
<div id="ixm"><div><h2>Índice de casos</h2><div class="ix" id="ix"></div><button class="b" id="ixc">Fechar</button></div></div>

<script>
/*GEN*/
const NAMES="Hugo,Beatriz,Carlos,Diana,Eduardo,Fátima,Gonçalo,Helena,Ivo,Joana,Leonor,Miguel,Natália,Óscar,Paula,Rui,Sofia,Tiago,Úrsula,Vasco,Alice,Bruno,Clara,Duarte,Elisa,Filipe,Graça,Henrique,Inês,Jorge,Karina,Luís,Marta,Nuno,Olga,Pedro,Rafael,Sara,Telmo,Zita".split(",");
const FEM=new Set("Beatriz,Diana,Fátima,Helena,Joana,Leonor,Natália,Paula,Sofia,Úrsula,Alice,Clara,Elisa,Graça,Inês,Karina,Marta,Olga,Sara,Zita".split(","));
const gd=(n,m,f)=>FEM.has(n)?f:m;
const TH=[
["Livraria do Beco","Sala de Leitura,Cave dos Raros,Balcão,Cafetaria,Armazém","📚|Estante,🪴|Planta,🧾|Caixa registadora,🛋️|Sofá,🪑|Cadeira,📦|Caixote"],
["Galeria Meridiano","Salão Principal,Ala Moderna,Oficina,Bilheteira,Cofre","🖼️|Quadro,🗿|Estátua,🪴|Planta,🪑|Banco,🧾|Caixa registadora,📦|Caixote"],
["Mansão dos Veiga","Hall,Biblioteca,Sala de Jantar,Cozinha,Estufa","🕰️|Relógio,🪴|Planta,🛋️|Sofá,📚|Estante,🍷|Garrafeira,🪑|Cadeira"],
["Escritório Sá & Nobre","Receção,Sala de Reuniões,Gabinete do Sócio,Arquivo,Copa","🗄️|Arquivo,🖥️|Secretária,🪴|Planta,🖨️|Fotocopiadora,🪑|Cadeira,☕|Máquina de café"],
["Restaurante Le Brasier","Sala,Cozinha,Esplanada,Bar,Despensa","🍽️|Mesa,🧾|Caixa registadora,🪴|Planta,🍷|Garrafeira,🔪|Talho,🪑|Cadeira"],
["Instituto Química Nova","Laboratório,Gabinete,Sala de Reagentes,Biblioteca,Cantina","🧪|Bancada,🔬|Microscópio,🪴|Planta,🗄️|Armário,🖥️|Computador,🪑|Cadeira"],
["Hotel Aurora","Receção,Restaurante,Piscina,Biblioteca,Cave","🛎️|Campainha,🪴|Planta,🛋️|Sofá,🧾|Caixa registadora,🪑|Cadeira,🧳|Mala"],
["Teatro Real do Porto","Palco,Plateia,Camarim,Bastidores,Bilheteira","🎭|Cenário,🪴|Planta,🪑|Cadeira,🧾|Caixa registadora,🎹|Piano,📦|Caixote"],
["Museu das Sombras","Sala Egípcia,Sala Medieval,Loja,Restauro,Pátio","🏺|Vitrine,🗿|Estátua,🪴|Planta,🧾|Caixa registadora,🪑|Banco,📦|Caixote"],
["Cruzeiro Estrela do Sul","Convés,Salão,Cabine,Casa das Máquinas,Cozinha","⚓|Âncora,🪴|Planta,🛋️|Sofá,🧰|Caixa de ferramentas,🪑|Cadeira,🍷|Garrafeira"]
];
const MOT=["tinha dívidas por saldar com a vítima","queria esconder um segredo antigo","não suportou ser trocado(a) por outro","cobiçava uma herança","temia ser denunciado(a)","foi chantageado(a) durante anos","queria vingar uma humilhação antiga","queria apagar um erro do passado"];
const rng=s=>{let a=s>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
const shuf=(R,a)=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const nb=i=>{const r=i/6|0,c=i%6,o=[];if(r>0)o.push(i-6);if(r<5)o.push(i+6);if(c>0)o.push(i-1);if(c<5)o.push(i+1);return o};
function mkRooms(R){for(;;){const g=Array(36).fill(-1);shuf(R,[...Array(36).keys()]).slice(0,5).forEach((s,i)=>g[s]=i);
 for(let left=31;left;left--){const cd=[];for(let i=0;i<36;i++)if(g[i]<0)nb(i).forEach(j=>{if(g[j]>=0)cd.push([i,g[j]])});const[i,r]=cd[Math.floor(R()*cd.length)];g[i]=r}
 const n=Array(5).fill(0);g.forEach(x=>n[x]++);if(Math.min(...n)>=4)return g}}
function count(C,cl,cap){const by=[[],[],[],[],[],[]];cl.forEach(c=>by[Math.max(...c.w)].push(c));const P=Array(6).fill(-1);let n=0;
 (function rec(s,ur,uc){if(n>=cap)return;
  if(s==6){let k=0;for(let i=0;i<6;i++)if(C.rooms[P[i]]===C.rooms[C.victim])k++;if(k==1)n++;return}
  for(let cell=0;cell<36;cell++){const r=cell/6|0,c=cell%6;if((ur>>r&1)||(uc>>c&1)||C.furnAt[cell]>=0||cell===C.victim)continue;P[s]=cell;
   if(by[s].every(q=>q.f(P)))rec(s+1,ur|1<<r,uc|1<<c)}P[s]=-1})(0,0,0);return n}
const CACHE={};
function build(n){if(CACHE[n])return CACHE[n];
 const R=rng(n*7919+13),[tt,rs,fs]=TH[(n-1)%10],rn=rs.split(","),fu=fs.split(",").map(x=>x.split("|"));
 for(;;){
  const rooms=mkRooms(R),nm=shuf(R,NAMES).slice(0,7),sus=nm.slice(0,6).sort((a,b)=>a.localeCompare(b,"pt")),vic=nm[6];
  const rp=shuf(R,[0,1,2,3,4,5]),cp=shuf(R,[0,1,2,3,4,5]),S=rp.map((r,s)=>r*6+cp[s]);
  const free=shuf(R,[...Array(36).keys()].filter(i=>!S.includes(i)));
  const furnAt=Array(36).fill(-1);free.slice(0,6).forEach((c,t)=>furnAt[c]=t);
  const cand=free.slice(6).filter(c=>S.filter(x=>rooms[x]===rooms[c]).length===1);
  if(!cand.length)continue;
  const victim=cand[0],murd=S.findIndex(x=>rooms[x]===rooms[victim]),C={rooms,furnAt,victim};
  const hasAdj=(c,t)=>nb(c).some(j=>furnAt[j]===t),rr=c=>c/6|0,cc=c=>c%6,pl=[];
  for(let s=0;s<6;s++){const a=sus[s],ro=rooms[S[s]];
   pl.push({w:[s],f:P=>rooms[P[s]]===ro,t:`${a} estava na divisão «${rn[ro]}».`});
   for(let k=0;k<5;k++)if(k!==ro)pl.push({w:[s],f:P=>rooms[P[s]]!==k,t:`${a} não estava na divisão «${rn[k]}».`});
   for(let t=0;t<6;t++){const h=hasAdj(S[s],t);pl.push({w:[s],f:P=>hasAdj(P[s],t)===h,t:`${a} ${h?"estava mesmo ao lado de":"não estava ao lado de"}: ${fu[t][0]} ${fu[t][1]}.`})}
   for(let u=s+1;u<6;u++){const b=sus[u],same=rooms[S[s]]===rooms[S[u]];
    pl.push({w:[s,u],f:P=>(rooms[P[s]]===rooms[P[u]])===same,t:`${a} e ${b} ${same?"estavam":"não estavam"} na mesma divisão.`});
    if(nb(S[s]).includes(S[u]))pl.push({w:[s,u],f:P=>nb(P[s]).includes(P[u]),t:`${a} e ${b} estavam lado a lado (na horizontal ou na vertical).`});
    const[x,y]=rr(S[s])<rr(S[u])?[s,u]:[u,s];pl.push({w:[x,y],f:P=>rr(P[x])<rr(P[y]),t:`${sus[x]} estava numa linha acima de ${sus[y]}.`});
    const[p,q]=cc(S[s])<cc(S[u])?[s,u]:[u,s];pl.push({w:[p,q],f:P=>cc(P[p])<cc(P[q]),t:`${sus[p]} estava numa coluna à esquerda de ${sus[q]}.`})}}
  let cl=[];for(const q of shuf(R,pl)){cl.push(q);if(count(C,cl,2)===1)break}
  if(count(C,cl,2)!==1)continue;
  for(let i=cl.length-1;i>=0;i--){const t=cl.filter((_,j)=>j!==i);if(count(C,t,2)===1)cl=t}
  const edge=[...Array(36).keys()].filter(i=>i<6||i>29||i%6==0||i%6==5);
  return CACHE[n]={n,title:`Caso ${n} — ${tt}`,rooms,furnAt,victim,sus,vic,rn,fu,S,murd,cl:cl.map(q=>q.t),win:shuf(R,edge).slice(0,4),motive:MOT[Math.floor(R()*MOT.length)],tt}}}
/*ENDGEN*/

const $=s=>document.querySelector(s);
let DB;try{DB=JSON.parse(localStorage.getItem("mrd80"))}catch(e){}DB=DB||{cur:1,c:{}};
const save=()=>{try{localStorage.setItem("mrd80",JSON.stringify(DB))}catch(e){}};
const cs=n=>DB.c[n]||(DB.c[n]={g:{},x:[],a:[],ok:0});
let K,st,mode="p",sel=0,rev=0,snd=true,ac;
function beep(f,d,v){if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=f;g.gain.value=v||.03;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const nz=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
const pos=c=>`linha ${(c/6|0)+1}, coluna ${"ABCDEF"[c%6]}`;

function boardHTML(g,x){
 const rc=Array(6).fill(0),cc=Array(6).fill(0);Object.keys(g).forEach(k=>{rc[k/6|0]++;cc[k%6]++});
 let h='<i class="l h"></i>'+[..."ABCDEF"].map(c=>`<i class="l h">${c}</i>`).join("");
 const tint=["#2e1e1e","#1d2c24","#1f2433","#302a18","#2c2030"];
 for(let r=0;r<6;r++){h+=`<i class="l">${r+1}</i>`;
  for(let c=0;c<6;c++){const i=r*6+c,rm=K.rooms[i];
   const B=(j,s)=>(j<0||K.rooms[j]!==rm)?`border-${s}:3px solid #c9a24b`:`border-${s}:1px dashed #4a3d25`;
   let t="",tl="";
   if(K.furnAt[i]>=0){t=K.fu[K.furnAt[i]][0];tl=K.fu[K.furnAt[i]][1]}
   else if(i===K.victim){t='<span class="vc">💀</span>';tl="Vítima: "+K.vic}
   else if(g[i]!==undefined)t=`<span class="sn">${K.sus[g[i]]}</span>`;
   else if(x.includes(i))t='<span style="color:#7a6a45">✕</span>';
   const bad=g[i]!==undefined&&(rc[r]>1||cc[c]>1);
   h+=`<div class="c${bad?" bad":""}" data-i="${i}" title="${tl}" style="background:${tint[rm]};${B(r?i-6:-1,"top")};${B(r<5?i+6:-1,"bottom")};${B(c?i-1:-1,"left")};${B(c<5?i+1:-1,"right")}">${K.rooms.indexOf(rm)===i?`<span class="rl">${K.rn[rm]}</span>`:""}${K.win.includes(i)?'<b class="wn">🪟</b>':""}${t}</div>`}}
 return h}

function draw(){
 $("#cn").textContent=`${K.n} / 80`;$("#tt").textContent=K.title;
 const room=K.rn[K.rooms[K.victim]];
 $("#st").textContent=`O corpo de ${K.vic} foi ${gd(K.vic,"encontrado","encontrada")} na divisão «${room}». Seis suspeitos estavam no local. Descobre quem estava ${"sozinho(a)"} com a vítima.`;
 $("#bd").innerHTML=boardHTML(st.g,st.x);
 const placed=new Set(Object.values(st.g));
 $("#pal").innerHTML=K.sus.map((n,s)=>`<button class="b${s===sel&&mode==="p"?" on":""}" data-s="${s}">${placed.has(s)?"✓ ":""}${n}</button>`).join("");
 document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
 $("#cl").innerHTML=K.cl.map(t=>`<li>${t}</li>`).join("");
 $("#dl").innerHTML=K.sus.map(n=>`<option value="${n}">`).join("");
 $("#hs").innerHTML=st.a.length?st.a.map((a,i)=>`<li>${new Date(a.t).toLocaleString("pt-PT")} — ${a.n} <b class="${a.ok?"ok":"no"}">${a.ok?"✓ certo":"✗ errado"}</b> <button class="b" data-r="${i}" style="padding:2px 8px">ver grelha</button></li>`).reverse().join(""):"<small>Ainda sem acusações neste caso.</small>";
 solHTML()}

function solHTML(){
 if(!rev){$("#sv").innerHTML='<button class="b" id="rv">Revelar solução (spoiler)</button>';return}
 const g=Object.fromEntries(K.S.map((c,s)=>[c,s]));
 $("#sv").innerHTML=`<div class="bd">${boardHTML(g,[])}</div><ul>${K.sus.map((n,s)=>`<li><b>${n}</b> — ${pos(K.S[s])}, «${K.rn[K.rooms[K.S[s]]]}»</li>`).join("")}</ul>
 <p>Raciocínio: cada pista elimina casas possíveis. Como há um só suspeito por linha e por coluna, ao fixares alguns suspeitos os restantes ficam forçados. No fim, ${K.vic} jazia na divisão «${K.rn[K.rooms[K.victim]]}» e o único suspeito lá dentro era <b>${K.sus[K.murd]}</b>.</p>
 <button class="b" id="ap">Aplicar à minha grelha</button>`}

function load(n){DB.cur=n;K=build(n);st=cs(n);rev=0;sel=0;$("#msg").textContent="";save();draw()}
function tw(t,ok){const el=$("#tx");el.textContent="";let i=0;clearInterval(tw.i);tw.i=setInterval(()=>{el.textContent+=t[i++]||"";if(i%2)beep(700+Math.random()*300,.03,.015);if(i>=t.length){clearInterval(tw.i);if(ok)[523,659,784].forEach((f,k)=>setTimeout(()=>beep(f,.4,.05),k*160))}},26)}
function modal(ok,n){$("#md").classList.add("s");$("#mn").style.display=ok&&K.n<80?"":"none";
 tw(ok?`CASO RESOLVIDO\n\n${n} estava ${gd(n,"sozinho","sozinha")} com ${K.vic} na divisão «${K.rn[K.rooms[K.victim]]}». Não resistiu ao interrogatório: ${K.motive}.`:`ACUSAÇÃO FALHADA\n\n${n} apresenta um álibi irrefutável. O verdadeiro culpado continua à solta… Revê a grelha, detetive.`,ok)}

$("#bd").onclick=e=>{const c=e.target.closest(".c");if(!c)return;const i=+c.dataset.i;if(K.furnAt[i]>=0||i===K.victim)return;
 if(mode==="p"){if(st.g[i]===sel)delete st.g[i];else{for(const k in st.g)if(st.g[k]===sel)delete st.g[k];st.g[i]=sel;st.x=st.x.filter(v=>v!==i);
   const pl=new Set(Object.values(st.g));const nx=K.sus.findIndex((_,s)=>!pl.has(s));if(nx>=0)sel=nx}}
 else if(mode==="x"){if(st.g[i]!==undefined)return;st.x=st.x.includes(i)?st.x.filter(v=>v!==i):[...st.x,i]}
 else{delete st.g[i];st.x=st.x.filter(v=>v!==i)}
 beep(300,.05);save();draw()};
$("#pal").onclick=e=>{const b=e.target.closest("[data-s]");if(b){sel=+b.dataset.s;mode="p";draw()}};
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
$("#clr").onclick=()=>{if(confirm("Limpar a grelha deste caso?")){st.g={};st.x=[];save();draw()}};
$("#ac").onsubmit=e=>{e.preventDefault();const s=K.sus.findIndex(n=>nz(n)===nz($("#an").value));
 if(s<0){$("#msg").textContent="Esse nome não consta do dossiê.";return}
 $("#msg").textContent="";const ok=s===K.murd;st.a.push({n:K.sus[s],ok,t:Date.now(),g:{...st.g},x:[...st.x]});if(ok)st.ok=1;save();$("#an").value="";draw();modal(ok,K.sus[s])};
$("#hs").onclick=e=>{const b=e.target.closest("[data-r]");if(!b)return;const a=st.a[+b.dataset.r];st.g={...a.g};st.x=[...a.x];save();draw()};
$("#sv").onclick=e=>{if(e.target.id==="rv"&&confirm("Isto revela a solução. Continuar?")){rev=1;draw()}
 if(e.target.id==="ap"){st.g=Object.fromEntries(K.S.map((c,s)=>[c,s]));save();draw()}};
$("#mc").onclick=()=>{$("#md").classList.remove("s");clearInterval(tw.i)};
$("#mn").onclick=()=>{$("#md").classList.remove("s");load(K.n+1)};
$("#pv").onclick=()=>K.n>1&&load(K.n-1);
$("#nx").onclick=()=>K.n<80&&load(K.n+1);
$("#sd").onclick=()=>{snd=!snd;$("#sd").textContent=(snd?"🔊":"🔇")+" Som"};
$("#ixb").onclick=()=>{$("#ix").innerHTML=Array.from({length:80},(_,i)=>{const c=DB.c[i+1];return`<button class="b ${c&&c.ok?"g":c&&c.a.length?"x":""}" data-n="${i+1}">${i+1}</button>`}).join("");$("#ixm").classList.add("s")};
$("#ix").onclick=e=>{const b=e.target.closest("[data-n]");if(b){$("#ixm").classList.remove("s");load(+b.dataset.n)}};
$("#ixc").onclick=()=>$("#ixm").classList.remove("s");
document.onkeydown=e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowLeft")$("#pv").click();if(e.key==="ArrowRight")$("#nx").click()};
load(DB.cur||1);
</script>
</body>
</html>
