 case"nroom":return p?`${a} não estava na divisão «${rname(d.r)}».`:`${a} was not in the «${rname(d.r)}».`;

 case"same":return p?`${a} e ${b} ${d.h?"estavam":"não estavam"} na mesma divisão.`:`${a} and ${b} ${d.h?"were":"were not"} in the same room.`;
 case"side":return p?`${a} e ${b} estavam lado a lado (na horizontal ou na vertical).`:`${a} and ${b} were side by side (horizontally or vertically).`;
 case"above":return p?`${a} estava numa linha acima de ${b}.`:`${a} was in a row above ${b}.`;
 case"left":return p?`${a} estava numa coluna à esquerda de ${b}.`:`${a} was in a column to the left of ${b}.`}}
const TINT=["#2e1e1e","#1d2c24","#1f2433","#302a18","#2c2030","#1e2e2e","#33241a","#242a1a","#2a1d28"];
function boardHTML(g,x,L,gr){
 const A=all(),rc=Array(6).fill(0),cc=Array(6).fill(0),rs=new Set(),cl=new Set();
 Object.keys(g).forEach(k=>{if(g[k]<6){rc[k/6|0]++;cc[k%6]++;if(gr){rs.add(k/6|0);cl.add(k%6)}}});
 let h='<i class="l h"></i>'+[..."ABCDEF"].map(c=>`<i class="l h">${c}</i>`).join("");
 for(let r=0;r<6;r++){h+=`<i class="l">${r+1}</i>`;
  for(let c=0;c<6;c++){const i=r*6+c,rm=L.rooms[i];
   const B=(j,s)=>(j<0||L.rooms[j]!==rm)?`border-${s}:3px solid #c9a24b`:`border-${s}:1px dashed #4a3d25`;
   let t="",tl="";
   if(L.fa[i]>=0){t=OB[L.fa[i]][0];tl=oname(L.fa[i])}
   else if(i===L.vic){t='<span class="vc">💀</span>'}
   else if(g[i]!==undefined)t=`<span class="sn${g[i]>=6?" ex":""}">${A[g[i]]}</span>`;
   else if(x.includes(i))t='<span style="color:#7a6a45">✕</span>';
   const sp=g[i]!==undefined,bad=sp&&g[i]<6&&(rc[r]>1||cc[c]>1),gy=!sp&&(rs.has(r)||cl.has(c));
   h+=`<div class="c${bad?" bad":""}${gy?" gy":""}" data-i="${i}" title="${tl}" style="background:${TINT[rm]};${B(r?i-6:-1,"top")};${B(r<5?i+6:-1,"bottom")};${B(c?i-1:-1,"left")};${B(c<5?i+1:-1,"right")}">${L.rooms.indexOf(rm)===i?`<span class="rl">${rname(rm)}</span>`:""}${K.win.includes(i)?'<b class="wn">🪟</b>':""}${t}</div>`}}
 return h}
function edHTML(){
 const el=$("#edt");el.style.display=ed?"":"none";if(!ed)return;const L=LY(),B=(a,t,x)=>`<button class="b${a?" on":""}" ${x}>${t}</button>`;
 el.innerHTML=`<h2>${T("rooms")}</h2><div class="tools">`+Array.from({length:L.nr},(_,k)=>B(et.t==="room"&&et.v===k,rname(k),`data-et="room:${k}"`)).join("")+B(0,T("addroom"),'id="ar"')+B(0,T("renroom"),'id="rr"')+
 `</div><h2>${T("objs")}</h2><div class="tools">`+OB.map((o,i)=>B(et.t==="obj"&&et.v===i,o[0],`data-et="obj:${i}" title="${oname(i)}" style="padding:4px 7px"`)).join("")+
 `</div><div class="tools">`+B(et.t==="del",T("del"),'data-et="del:0"')+B(et.t==="vic",T("vic"),'data-et="vic:0"')+B(0,T("addp"),'id="ap2"')+B(0,T("renv"),'id="rv2"')+B(0,T("reset"),'id="rs"')+`</div><div id="chk">${T("chk")[solveCur().n]}</div>`}
function solHTML(){
 if(!rev){$("#sv").innerHTML=`<button class="b" id="rv">${T("reveal")}</button>`;return}
 const L=LY(),s=solveCur();if(!s.n){$("#sv").innerHTML=`<p>${T("chk")[0]}</p>`;return}
 const g=Object.fromEntries(s.first.map((c,i)=>[c,i])),m=s.first.findIndex(c=>L.rooms[c]===L.rooms[L.vic]),N=nmS();
 $("#sv").innerHTML=`<div class="bd">${boardHTML(g,[],L,false)}</div><ul>${N.map((n,i)=>`<li><b>${n}</b> — ${pos(s.first[i])}, «${rname(L.rooms[s.first[i]])}»</li>`).join("")}</ul><p>${T("expl",vn(),rname(L.rooms[L.vic]),N[m])}</p>${s.n>1?`<p class="no">${T("many")}</p>`:""}<button class="b" id="ap">${T("apply")}</button>`}
function draw(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
 $("#sd").textContent=(snd?"🔊 ":"🔇 ")+T("sound");$("#lg").textContent="🌐 "+(P_()?"English":"Português");$("#eb").textContent=ed?T("done"):T("edit");
 $("#an").placeholder=T("ph");$("#tools").style.display=ed?"none":"";
 $("#cn").textContent=`${K.n} / 80`;$("#tt").textContent=`${T("case")} ${K.n} — ${TH[K.ti][P_()?0:1]}`;
 const L=LY();
 $("#st").textContent=T("story",vn(),rname(L.rooms[L.vic]),FEM.has(vn()));
 $("#bd").innerHTML=boardHTML(st.g,st.x,L,true);
 const pl=new Set(Object.values(st.g));
 $("#pal").innerHTML=all().map((n,s)=>`<button class="b${s===sel&&mode==="p"&&!ed?" on":""}${s>=6?" xs":""}" data-s="${s}">${ed?"✎ ":pl.has(s)?"✓ ":""}${n}</button>`).join("");
 document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
 $("#cl").innerHTML=K.cl.map(d=>`<li>${txt(d)}</li>`).join("");
 $("#dl").innerHTML=nmS().map(n=>`<option value="${n}">`).join("");
 $("#hs").innerHTML=st.a.length?st.a.map((a,i)=>`<li>${new Date(a.t).toLocaleString(P_()?"pt-PT":"en-GB")} — ${a.n} <b class="${a.ok?"ok":"no"}">${T(a.ok?"ok":"ko")}</b> <button class="b" data-r="${i}" style="padding:2px 8px">${T("view")}</button></li>`).reverse().join(""):`<small>${T("nolog")}</small>`;
 edHTML();solHTML()}
function load(n){DB.cur=n;K=build(n);st=cs(n);rev=0;sel=0;$("#msg").textContent="";save();draw()}
function tw(t,ok){const el=$("#tx");el.textContent="";let i=0;clearInterval(tw.i);tw.i=setInterval(()=>{el.textContent+=t[i++]||"";if(i%2)beep(700+Math.random()*300,.03,.015);if(i>=t.length){clearInterval(tw.i);if(ok)[523,659,784].forEach((f,k)=>setTimeout(()=>beep(f,.4,.05),k*160))}},26)}
function modal(ok,n,L,m){$("#md").classList.add("s");$("#mn").style.display=ok&&K.n<80?"":"none";
 tw(ok?T("win",n,vn(),rname(L.rooms[L.vic]),MO[lang][(K.n*5+K.ti)%8],FEM.has(n)):T("lose",n),ok)}
$("#bd").onclick=e=>{const c=e.target.closest(".c");if(!c)return;const i=+c.dataset.i;
 if(ed){const E=ensureEd();
  if(et.t==="room")E.rooms[i]=et.v;
  else if(et.t==="obj"){if(i===E.vic)return;E.fa[i]=E.fa[i]===et.v?-1:et.v;if(E.fa[i]>=0)drop(i)}
  else if(et.t==="del")E.fa[i]=-1;
  else if(et.t==="vic"){if(E.fa[i]>=0)return;E.vic=i;drop(i)}
  beep(300,.05);save();draw();return}
 const L=LY();if(L.fa[i]>=0||i===L.vic)return;
 if(mode==="p"){if(st.g[i]===sel)delete st.g[i];else{for(const k in st.g)if(st.g[k]===sel)delete st.g[k];st.g[i]=sel;st.x=st.x.filter(v=>v!==i);
   const pl=new Set(Object.values(st.g)),nx=all().findIndex((_,s)=>!pl.has(s));if(nx>=0)sel=nx}}
 else if(mode==="x"){if(st.g[i]!==undefined)return;st.x=st.x.includes(i)?st.x.filter(v=>v!==i):[...st.x,i]}
 else drop(i);
 beep(300,.05);save();draw()};
$("#pal").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;const s=+b.dataset.s;
 if(!ed){sel=s;mode="p";draw();return}
 const v=prompt(T("askren"),all()[s]);if(v===null)return;const n=v.trim();
 if(s<6){if(n){st.nm=[...nmS()];st.nm[s]=n}}
 else if(n)st.ex[s-6]=n;
 else{st.ex.splice(s-6,1);const g={};for(const k in st.g){const w=st.g[k];if(w!==s)g[k]=w>s?w-1:w}st.g=g;sel=0}
 save();draw()};
$("#edt").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.et){const[t,v]=b.dataset.et.split(":");et={t,v:+v}}
 else if(b.id==="ar"){const E=ensureEd();if(E.nr>=9)return;const n=prompt(T("askroom"));if(!n||!n.trim())return;st.rc=st.rc||{};st.rc[E.nr]=n.trim();et={t:"room",v:E.nr};E.nr++}
 else if(b.id==="rr"){if(et.t!=="room")return;const n=prompt(T("askroom"),rname(et.v));if(!n||!n.trim())return;st.rc=st.rc||{};st.rc[et.v]=n.trim()}
 else if(b.id==="ap2"){const n=prompt(T("askname"));if(!n||!n.trim())return;(st.ex=st.ex||[]).push(n.trim())}
 else if(b.id==="rv2"){const n=prompt(T("askname"),vn());if(!n||!n.trim())return;st.vn=n.trim()}
 else if(b.id==="rs"){if(!confirm(T("creset")))return;st.ed=null;st.rc=null;st.nm=null;st.ex=[];st.vn=null;st.g={};st.x=[];sel=0}
 save();draw()};
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
$("#clr").onclick=()=>{if(confirm(T("cclear"))){st.g={};st.x=[];save();draw()}};
$("#ac").onsubmit=e=>{e.preventDefault();const A=all(),s=A.findIndex(n=>nz(n)===nz($("#an").value));
 if(s<0){$("#msg").textContent=T("unk");return}
 const sol=solveCur();if(sol.n!==1){$("#msg").textContent=T("noval");return}
 $("#msg").textContent="";const L=LY(),m=sol.first.findIndex(c=>L.rooms[c]===L.rooms[L.vic]),ok=s===m;
 st.a.push({n:A[s],ok,t:Date.now(),g:{...st.g},x:[...st.x],ed:st.ed?JSON.parse(JSON.stringify(st.ed)):null,nm:st.nm,ex:st.ex,vn:st.vn,rc:st.rc});
 if(ok)st.ok=1;save();$("#an").value="";draw();modal(ok,A[s],L)};
$("#hs").onclick=e=>{const b=e.target.closest("[data-r]");if(!b)return;const a=st.a[+b.dataset.r];
 st.g={...a.g};st.x=[...a.x];st.ed=a.ed?JSON.parse(JSON.stringify(a.ed)):null;st.nm=a.nm;st.ex=a.ex;st.vn=a.vn;st.rc=a.rc;save();draw()};
$("#sv").onclick=e=>{if(e.target.id==="rv"&&confirm(T("crev"))){rev=1;draw()}
 if(e.target.id==="ap"){const s=solveCur();if(s.n){st.g=Object.fromEntries(s.first.map((c,i)=>[c,i]));save();draw()}}};
$("#mc").onclick=()=>{$("#md").classList.remove("s");clearInterval(tw.i)};
$("#mn").onclick=()=>{$("#md").classList.remove("s");load(K.n+1)};
$("#pv").onclick=()=>K.n>1&&load(K.n-1);
$("#nx").onclick=()=>K.n<80&&load(K.n+1);
$("#sd").onclick=()=>{snd=!snd;draw()};
$("#lg").onclick=()=>{lang=P_()?"en":"pt";DB.lang=lang;save();draw()};
$("#eb").onclick=()=>{ed=!ed;draw()};
$("#ixb").onclick=()=>{$("#ix").innerHTML=Array.from({length:80},(_,i)=>{const c=DB.c[i+1];return`<button class="b ${c&&c.ok?"g":c&&c.a.length?"x":""}" data-n="${i+1}">${i+1}</button>`}).join("");$("#ixm").classList.add("s")};
$("#ix").onclick=e=>{const b=e.target.closest("[data-n]");if(b){$("#ixm").classList.remove("s");load(+b.dataset.n)}};
$("#ixc").onclick=()=>$("#ixm").classList.remove("s");
document.onkeydown=e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowLeft")$("#pv").click();if(e.key==="ArrowRight")$("#nx").click()};
load(DB.cur||1);
</script></body></html>
